[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinergia-a2"
version = "0.5.0"
description = "SinergIA · Agente A2 Bem-Estar: RAG com 4 bases, roteamento dinâmico e guardrails (protocolo sinergia/1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pypdf>=4.0",
    "tzdata",                       # zoneinfo no Windows
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",                # planilha de análise das interações              # registro de interações (SQLite por padrão)
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
llm = ["langchain-groq>=0.2"]
pg = ["psycopg[binary]>=3.1"]
console = ["fastapi>=0.110", "uvicorn>=0.29"]
bases = ["reportlab>=4.0"]                  # gerar os PDFs a partir de bases_fonte/
dev = ["pytest>=8", "httpx>=0.27"]
completo = ["sinergia-a2[embeddings,llm,pg,console,bases,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
